name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 版本号必须和 tag 一致
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: 发布前再跑一遍
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q --ignore=tests/test_send_x11.py
          python scripts/audit-release.py
      - name: 构建 release 包（和本地同一个脚本）
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: 构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
