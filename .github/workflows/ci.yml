name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: X11 测试需要的系统包
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb fluxbox python3-tk libx11-6 libxtst6 libsqlite3-0
      - run: python -m pip install -r requirements-dev.txt
      - name: 单元测试和假微信端到端测试
        env:
          FAKE_PYTHON: /usr/bin/python3
        run: python -m pytest -q
      - name: 离线 demo
        run: ./bin/wechat-export-send demo --output "$RUNNER_TEMP/demo"
      - name: 隐私检查
        run: python scripts/audit-release.py
      - name: compose 文件语法
        env:
          INSTANCE: ci
          INSTANCE_DIR: /tmp/ci
          CLIENT_ROOT: /tmp/ci
          DESKTOP_PASSWORD: CI_ONLY_NOT_A_REAL_PASSWORD
          VNC_PROXY_BIND: 127.0.0.1
          VNC_PROXY_HTPASSWD: /tmp/ci/htpasswd
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.selkies.yaml config --quiet
          docker compose -f compose.proxy.yaml config --quiet
      - name: 脚本语法
        run: sh -n install.sh && sh -n scripts/build-release.sh && sh -n bin/wechat-send

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: |
          docker build -t wechat-export-send-tools:ci -f docker/tools/Dockerfile .
          docker build -t wechat-export-send-desktop:ci docker/desktop
      - name: 工具镜像无网络、只读可运行
        run: docker run --rm --network none --read-only --cap-drop ALL wechat-export-send-tools:ci -m wechat_export_send.cli --version
