[unix_http_server]
file=/config/.supervisor/supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///config/.supervisor/supervisor.sock

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1280x900x24 -nolisten tcp -ac
priority=10
autorestart=true
stdout_logfile=/tmp/display.log
stderr_logfile=/tmp/display.err

[program:window-manager]
command=/usr/bin/fluxbox -display :99
priority=20
autorestart=true
startsecs=2
stdout_logfile=/tmp/fluxbox.log
stderr_logfile=/tmp/fluxbox.err

[program:vnc]
command=/usr/bin/x11vnc -display :99 -rfbport 5900 -localhost -nopw -forever -shared -noxdamage
priority=30
autorestart=true
startsecs=2
stdout_logfile=/tmp/vnc.log
stderr_logfile=/tmp/vnc.err

[program:web]
command=/usr/bin/websockify --web /usr/share/novnc 7900 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/tmp/web.log
stderr_logfile=/tmp/web.err

[program:wechat]
command=/bin/sh /deployment/start-wechat.sh
priority=50
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
startsecs=10
startretries=2
stdout_logfile=/tmp/wechat.log
stderr_logfile=/tmp/wechat.err
